<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TIMER NASA</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div id="container-timer-title">
        <h1>TIMER NASA</h1>
    </div>

    <div id="container-timer-card">
        <span id="timer-card-data">
            <!-- Contenido inyectado por JS -->
        </span>
    </div>

    <div id="container-timer-input">
        <label>Igresa la cantidad de segundos</label>
        <input type="number" id="timer-input" placeholder="Ingresa segundos">
    </div>

    <div id="container-timer-button">
        <button id="timer-button">START</button>
    </div>

    <script src="./scripts.js"></script>
</body>
</html>
